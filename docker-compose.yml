version: '3.8'

services:
  # 1. Base de Datos Relacional y Espacial
  db:
    image: postgis/postgis:15-3.4
    container_name: baches_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Cola de Tareas y Caché
  redis:
    image: redis:7-alpine
    container_name: baches_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 3. Almacenamiento de Evidencias (S3 Compatible)
  minio:
    image: pgsty/silo:latest
    container_name: baches_storage
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # 4. API Principal (FastAPI)
  api:
    build: .
    container_name: baches_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - minio

  # 5. Trabajador Asíncrono para IA (Celery)
  worker:
    build: .
    container_name: baches_worker
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - minio

volumes:
  pgdata:
  redisdata:
  miniodata: